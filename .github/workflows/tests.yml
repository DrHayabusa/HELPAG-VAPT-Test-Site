name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile
        run: python -m py_compile app.py labsite/*.py tools/*.py
      - name: Playbook is in sync with the challenge catalogue
        run: python tools/check_playbook.py

  range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring the range up
        run: |
          cp .env.example .env
          docker compose up --build -d
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5005/health && break || sleep 2
          done
      - name: Solve every challenge
        run: ./tools/validate_range.sh http://127.0.0.1:5005
      - name: Show the event stream on failure
        if: failure()
        run: docker compose logs --tail 100
