# Shorthands used by the documented searches. Optional but they keep the SPL in
# CTF_PLAYBOOK.md and USE_CASES.md short.

[helpag_events]
definition = index=vapt_lab sourcetype=helpag:owasp:json
iseval = 0

[helpag_iis]
definition = index=vapt_lab sourcetype=iis
iseval = 0

[helpag_exploit_events]
definition = index=vapt_lab sourcetype=helpag:owasp:json event_type IN (sql_query,sql_error,xss_probe,stored_xss_persisted,path_traversal_attempt,command_injection_attempt,command_execution,ssti_attempt,xxe_attempt,dangerous_upload,jndi_lookup_detected,ssrf_probe,jwt_unsigned_accepted,forged_session_detected,account_takeover,privilege_change,mass_assignment_attempt,artifact_disclosed)
iseval = 0

[helpag_kill_chain_stage]
definition = eval stage=case(event_type IN ("recon_robots_read","recon_hidden_path","http_not_found"),"1-recon", event_type IN ("sql_query","xss_probe","ssti_attempt","xxe_attempt","command_injection_attempt","path_traversal_attempt"),"2-exploit", event_type IN ("privilege_change","jwt_unsigned_accepted","forged_session_detected","account_takeover","agent_session_compromised","staff_session_compromised"),"3-privesc", event_type IN ("command_execution","dangerous_upload","sensitive_file_access","ssrf_probe","artifact_disclosed"),"4-objective")
iseval = 0
