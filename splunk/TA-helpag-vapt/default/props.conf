# Field extraction for the HELP AG VAPT range.
#
# IMPORTANT: INDEXED_EXTRACTIONS is a parsing-time setting. For file-monitored
# data it must be present on the FORWARDER that reads the file, not only on the
# indexer or search head. Deploy this app to the Universal Forwarder as well.
# For HEC-delivered events the setting applies on the indexer instead.

[helpag:owasp:json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 20000
description = HELP AG VAPT range - JSON security events

# IIS W3C access logs. Splunk ships an `iis` sourcetype; this stanza makes the
# field names the detection searches rely on explicit rather than assumed.
[iis]
INDEXED_EXTRACTIONS = w3c
KV_MODE = none
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TZ = UTC
description = IIS W3C access logs (UTC, as IIS writes them)
