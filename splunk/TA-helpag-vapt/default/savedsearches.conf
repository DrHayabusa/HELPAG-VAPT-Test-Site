# HELP AG VAPT range - detection use cases.
#
# Every search below is disabled (enableSched = 0). Validate the field mappings
# in your own environment, tune the thresholds to your range, then enable the
# ones your notification policy allows.
#
# UC-## identifiers match CTF_PLAYBOOK.md.

[HELPAG UC-01 Hidden Path Discovery]
search = index=vapt_lab sourcetype=helpag:owasp:json event_type IN (recon_robots_read,recon_hidden_path,http_not_found) | bin _time span=5m | stats count dc(path) as unique_paths values(path) as paths by _time source_ip | where count>=10 OR unique_paths>=8
description = Wordlist or crawler-driven discovery of non-linked paths. MITRE T1595.003.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

[HELPAG UC-02 Sensitive File Retrieval]
search = index=vapt_lab sourcetype=helpag:owasp:json event_type IN (sensitive_file_access,directory_listing_access,sensitive_data_exposure) | stats count values(artifact) as artifacts dc(artifact) as unique_artifacts by source_ip
description = Retrieval of .env, backup archives or exposed secrets. MITRE T1552.001.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

