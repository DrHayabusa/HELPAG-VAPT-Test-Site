[HELPAG UC-21 Kill Chain Correlation]
search = index=vapt_lab sourcetype=helpag:owasp:json | eval stage=case(event_type IN ("recon_robots_read","recon_hidden_path","http_not_found"),"1-recon", event_type IN ("sql_query","xss_probe","ssti_attempt","xxe_attempt","command_injection_attempt","path_traversal_attempt"),"2-exploit", event_type IN ("privilege_change","jwt_unsigned_accepted","forged_session_detected","account_takeover"),"3-privesc", event_type IN ("command_execution","dangerous_upload","sensitive_file_access","ssrf_probe"),"4-objective") | search stage=* | stats dc(stage) as stages values(stage) as observed values(event_type) as events min(_time) as first max(_time) as last by source_ip | where stages>=3
description = A single source that progressed through three or more attack stages. The highest-value alert in this pack.
cron_schedule = */10 * * * *
dispatch.earliest_time = -60m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0
