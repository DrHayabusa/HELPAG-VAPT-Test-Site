[HELPAG High Rate IIS Scanner]
search = index=vapt_lab sourcetype=iis | bin _time span=1m | stats count dc(cs_uri_stem) as unique_paths by _time c_ip | where count>=30 OR unique_paths>=15
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

