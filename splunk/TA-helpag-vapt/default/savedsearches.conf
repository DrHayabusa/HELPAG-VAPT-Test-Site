[HELPAG A07 Authentication Attack]
search = index=vapt_lab sourcetype=helpag:owasp:json event_type=authentication_attempt | bin _time span=5m | stats count count(eval(success=false)) as failures count(eval(success=true)) as successes by _time source_ip username | where failures>=3 OR successes>0
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

