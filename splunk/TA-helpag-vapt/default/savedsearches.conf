[HELPAG A01 Broken Access Control]
search = index=vapt_lab sourcetype=helpag:owasp:json event_type=broken_access_attempt allowed=true | stats count values(object_id) as object_ids by source_ip
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

[HELPAG A02 Sensitive Data Exposure]
search = index=vapt_lab sourcetype=helpag:owasp:json event_type=sensitive_data_exposure | stats count values(artifact) as artifacts by source_ip
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

[HELPAG A03 Injection Probe]
search = index=vapt_lab sourcetype=helpag:owasp:json (event_type=sql_error OR event_type=xss_probe OR (event_type=sql_query suspicious=true)) | stats count values(query_input) as inputs by source_ip event_type
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
enableSched = 0

